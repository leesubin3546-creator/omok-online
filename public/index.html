<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목 온라인</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg: #13100c;
    --surface: #1e1a14;
    --card: #28231c;
    --border: rgba(210,170,100,0.18);
    --accent: #c8922a;
    --accent2: #e8d09a;
    --text: #f2e8d8;
    --text2: #a89070;
    --board-bg: #d4a96a;
    --board-line: #8b6328;
    --radius: 14px;
    --shadow: 0 8px 36px rgba(0,0,0,0.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 14px 32px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.25rem; color: var(--accent2); letter-spacing: 3px; font-weight: 600; }
  #player-info { font-size: 0.88rem; color: var(--text2); }
  #player-info span { color: var(--accent); font-weight: 700; }

  .screen { display: none; width: 100%; max-width: 1160px; padding: 28px 16px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 22px;
    border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px;
  }
  .card-title {
    font-size: 0.85rem;
    color: var(--accent2);
    letter-spacing: 2px;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* 닉네임 */
  #nick-screen.active { justify-content: center; min-height: 80vh; }
  #nickname-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 44px 48px;
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 14px;
    text-align: center;
  }
  #nickname-area .logo { font-size: 2.2rem; color: var(--accent2); letter-spacing: 5px; font-weight: 700; }
  #nickname-area .sub { color: var(--text2); font-size: 0.88rem; line-height: 1.6; }

  /* 로비 */
  .lobby-wrap { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; }
  .lobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lobby-wide { grid-column: 1 / -1; }

  /* 기록 */
  .record-stats { display: flex; gap: 12px; }
  .stat {
    flex: 1; text-align: center;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 8px;
    border: 1px solid var(--border);
  }
  .stat-num { font-size: 1.8rem; font-weight: 700; }
  .stat-num.win { color: #7ecb7e; }
  .stat-num.lose { color: #d07070; }
  .stat-num.draw { color: var(--accent2); }
  .stat-label { font-size: 0.75rem; color: var(--text2); margin-top: 3px; }

  /* 돌 디자인 선택 */
  .stone-picker-desc { color: var(--text2); font-size: 0.8rem; margin-top: -4px; }
  .stone-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .stone-opt {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; padding: 12px 10px 10px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card);
    transition: all 0.18s;
    user-select: none;
    flex: 1; min-width: 80px;
  }
  .stone-opt:hover { border-color: rgba(200,146,42,0.5); transform: translateY(-2px); }
  .stone-opt.selected {
    border-color: var(--accent);
    background: rgba(200,146,42,0.1);
    box-shadow: 0 0 18px rgba(200,146,42,0.22);
  }
  .stone-opt span { font-size: 0.72rem; color: var(--text2); font-weight: 600; letter-spacing: 0.5px; }
  .stone-opt.selected span { color: var(--accent); }

  /* 입력/버튼 */
  input[type=text] {
    width: 100%;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 10px 20px;
    border: none; border-radius: 9px;
    font-size: 0.9rem; cursor: pointer;
    transition: all 0.18s; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #1a1000; }
  .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #352d22; }
  .btn-sm { padding: 7px 14px; font-size: 0.82rem; }
  .muted { color: var(--text2); font-size: 0.88rem; line-height: 1.5; }

  /* 게임 화면 */
  #game-screen.active {
    flex-direction: row; align-items: flex-start;
    justify-content: center; flex-wrap: wrap; gap: 20px;
  }
  #board-wrap {
    position: relative;
    background: var(--board-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    user-select: none;
    border: 3px solid #a07030;
  }
  #board-canvas { display: block; cursor: crosshair; }

  #side-panel { width: 272px; display: flex; flex-direction: column; gap: 11px; min-width: 240px; }

  .player-card {
    background: var(--surface);
    border-radius: 11px; padding: 12px 15px;
    display: flex; align-items: center; gap: 11px;
    border: 1.5px solid var(--border);
    transition: border-color 0.25s;
  }
  .player-card.active-turn { border-color: var(--accent); }
  .stone-icon-canvas { width: 28px; height: 28px; flex-shrink: 0; }
  .player-name { font-weight: 700; flex: 1; font-size: 0.92rem; }
  .player-rec { font-size: 0.72rem; color: var(--text2); }

  /* 플레이어 카드 스타일 태그 */
  .style-badge {
    font-size: 0.65rem; color: var(--text2); background: var(--card);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; letter-spacing: 0.5px;
  }

  #status-bar {
    background: var(--surface); border-radius: 10px;
    padding: 11px 14px; text-align: center;
    font-size: 0.9rem; color: var(--accent2);
    font-weight: 700; border: 1px solid var(--border);
    letter-spacing: 1px;
  }
  #chat-box {
    background: var(--surface); border-radius: 11px;
    border: 1px solid var(--border);
    display: flex; flex-direction: column; height: 210px; overflow: hidden;
  }
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    font-size: 0.83rem; display: flex; flex-direction: column; gap: 3px;
  }
  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-thumb { background: #3a2e22; border-radius: 4px; }
  .chat-msg { line-height: 1.5; }
  .chat-msg .cn { color: var(--accent); font-weight: 700; }
  .chat-msg .sys { color: var(--text2); font-style: italic; }
  #chat-input-row {
    display: flex; gap: 6px; padding: 7px 10px;
    border-top: 1px solid var(--border);
  }
  #chat-input { flex: 1; padding: 6px 10px; font-size: 0.83rem; }

  /* 오버레이 */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.78); z-index: 100;
    align-items: center; justify-content: center;
  }
  #overlay.show { display: flex; }
  #overlay-box {
    background: var(--surface);
    border-radius: var(--radius); padding: 40px 48px;
    text-align: center; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 16px; min-width: 300px;
  }
  #overlay-title { font-size: 2rem; font-weight: 700; }
  #overlay-sub { color: var(--text2); }
  #overlay-records { display: flex; gap: 24px; justify-content: center; }
  .ov-rec { text-align: center; }
  .ov-rec-name { font-size: 0.78rem; color: var(--text2); }
  .ov-rec-val { font-size: 0.92rem; }
  #overlay-btns { display: flex; gap: 10px; justify-content: center; }

  /* 대기 */
  #waiting-screen.active { justify-content: center; min-height: 60vh; }
  .waiting-box {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 48px 60px;
    text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  .spinner {
    width: 46px; height: 46px;
    border: 3px solid var(--card);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .room-id-display {
    background: var(--card); border-radius: 9px; padding: 12px 20px;
    font-size: 1.6rem; letter-spacing: 8px; font-weight: 700;
    color: var(--accent2); text-align: center; border: 1px solid var(--border);
  }
  .error-msg { color: #d07070; font-size: 0.83rem; min-height: 18px; }

  @media (max-width: 700px) {
    .lobby-grid { grid-template-columns: 1fr; }
    #game-screen.active { flex-direction: column; align-items: center; }
    #side-panel { width: 100%; max-width: 420px; }
    .stone-picker { gap: 6px; }
    .stone-opt { min-width: 60px; padding: 10px 6px 8px; }
  }
</style>
</head>
<body>

<header>
  <h1>◉ 오목 온라인</h1>
  <div id="player-info">접속자: <span id="header-nick">-</span></div>
</header>

<!-- 닉네임 -->
<div id="nick-screen" class="screen active">
  <div id="nickname-area">
    <div class="logo">◉ 오목</div>
    <p class="sub">온라인 대전을 시작하려면<br>닉네임을 입력하세요</p>
    <input id="nick-input" type="text" placeholder="닉네임 (2~12자)" maxlength="12">
    <div id="nick-error" class="error-msg"></div>
    <button class="btn-primary" onclick="setNickname()">시작하기</button>
  </div>
</div>

<!-- 로비 -->
<div id="lobby-screen" class="screen">
  <div class="lobby-wrap">

    <div class="card">
      <div class="card-title">나의 기록</div>
      <div class="record-stats">
        <div class="stat"><div class="stat-num win" id="rec-win">0</div><div class="stat-label">승</div></div>
        <div class="stat"><div class="stat-num lose" id="rec-lose">0</div><div class="stat-label">패</div></div>
        <div class="stat"><div class="stat-num draw" id="rec-draw">0</div><div class="stat-label">무</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">나의 돌 디자인</div>
      <p class="stone-picker-desc">각자 선택한 디자인이 게임에서 그대로 적용됩니다</p>
      <div class="stone-picker" id="stone-picker">
        <div class="stone-opt" data-style="classic" onclick="selectStoneStyle('classic')">
          <canvas id="sp-classic" width="80" height="44"></canvas>
          <span>클래식</span>
        </div>
        <div class="stone-opt" data-style="flat" onclick="selectStoneStyle('flat')">
          <canvas id="sp-flat" width="80" height="44"></canvas>
          <span>플랫</span>
        </div>
        <div class="stone-opt" data-style="marble" onclick="selectStoneStyle('marble')">
          <canvas id="sp-marble" width="80" height="44"></canvas>
          <span>마블</span>
        </div>
        <div class="stone-opt" data-style="glass" onclick="selectStoneStyle('glass')">
          <canvas id="sp-glass" width="80" height="44"></canvas>
          <span>유리</span>
        </div>
        <div class="stone-opt" data-style="neon" onclick="selectStoneStyle('neon')">
          <canvas id="sp-neon" width="80" height="44"></canvas>
          <span>네온</span>
        </div>
      </div>
    </div>

    <div class="lobby-grid">
      <div class="card">
        <div class="card-title">랜덤 매칭</div>
        <p class="muted">대기 중인 상대를 자동으로 찾아드립니다</p>
        <button class="btn-primary" onclick="joinRandom()">빠른 대전 시작</button>
      </div>
      <div class="card">
        <div class="card-title">방 만들기</div>
        <p class="muted">방 코드를 친구에게 공유하세요</p>
        <button class="btn-secondary" onclick="createRoom()">방 만들기</button>
      </div>
      <div class="card lobby-wide">
        <div class="card-title">방 참가</div>
        <div style="display:flex;gap:8px;">
          <input id="room-code-input" type="text" placeholder="방 코드 입력" maxlength="6" style="text-transform:uppercase">
          <button class="btn-secondary" onclick="joinRoom()">입장</button>
        </div>
        <div id="join-error" class="error-msg"></div>
      </div>
    </div>

  </div>
</div>

<!-- 대기 -->
<div id="waiting-screen" class="screen">
  <div class="waiting-box">
    <div class="spinner"></div>
    <div id="waiting-title" style="font-size:1.15rem;font-weight:700;">상대방을 기다리는 중...</div>
    <div id="waiting-sub" class="muted">방 코드를 친구에게 알려주세요</div>
    <div id="waiting-room-code" class="room-id-display" style="display:none;"></div>
    <button class="btn-secondary btn-sm" onclick="cancelWaiting()">취소</button>
  </div>
</div>

<!-- 게임 -->
<div id="game-screen" class="screen">
  <div id="board-wrap">
    <canvas id="board-canvas"></canvas>
  </div>
  <div id="side-panel">
    <div id="player1-card" class="player-card">
      <canvas id="p1-stone-icon" class="stone-icon-canvas" width="28" height="28"></canvas>
      <div style="flex:1;min-width:0;">
        <div class="player-name" id="p1-name">-</div>
        <div class="player-rec" id="p1-rec">0승 0패</div>
      </div>
      <span class="style-badge" id="p1-style-badge">클래식</span>
    </div>
    <div id="player2-card" class="player-card">
      <canvas id="p2-stone-icon" class="stone-icon-canvas" width="28" height="28"></canvas>
      <div style="flex:1;min-width:0;">
        <div class="player-name" id="p2-name">-</div>
        <div class="player-rec" id="p2-rec">0승 0패</div>
      </div>
      <span class="style-badge" id="p2-style-badge">클래식</span>
    </div>
    <div id="status-bar">게임 준비 중...</div>
    <button class="btn-secondary btn-sm" onclick="resignGame()" id="resign-btn">기권하기</button>
    <div id="chat-box">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="메시지 입력..." maxlength="200">
        <button class="btn-secondary btn-sm" onclick="sendChat()">전송</button>
      </div>
    </div>
  </div>
</div>

<!-- 오버레이 -->
<div id="overlay">
  <div id="overlay-box">
    <div id="overlay-title">게임 종료</div>
    <div id="overlay-sub"></div>
    <div id="overlay-records"></div>
    <div id="overlay-btns">
      <button class="btn-primary" onclick="requestRematch()" id="rematch-btn">재대결</button>
      <button class="btn-secondary" onclick="goLobby()">로비로</button>
    </div>
  </div>
</div>

<script>
const CELL = 36, PADDING = 22, SIZE = 15;
const CANVAS_SIZE = CELL * (SIZE - 1) + PADDING * 2;
const STYLE_NAMES = { classic:'클래식', flat:'플랫', marble:'마블', glass:'유리', neon:'네온' };

let socket = null;
let myNickname = localStorage.getItem('omok_nickname') || '';
let currentRoom = null;
let myColor = 0;
let myRecord = { win: 0, lose: 0, draw: 0 };
let gameBoard = [];
let currentTurn = 1;
let isSpectating = false;
let gameActive = false;
let currentStoneStyle = localStorage.getItem('omok_stone_style') || 'classic';
let p1StoneStyle = 'classic'; // 흑돌 플레이어의 스타일
let p2StoneStyle = 'classic'; // 백돌 플레이어의 스타일

// ── 돌 드로잉 ─────────────────────────────────────────────────
function drawStoneOnCtx(c, x, y, r, color, style) {
  c.save();
  switch(style) {

    case 'classic': {
      // 3D 구체 - 풍부한 그라디언트
      const g = c.createRadialGradient(x - r*0.3, y - r*0.3, r*0.04, x, y, r);
      if (color === 1) {
        g.addColorStop(0, '#606060');
        g.addColorStop(0.3, '#282828');
        g.addColorStop(0.7, '#101010');
        g.addColorStop(1, '#040404');
      } else {
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.4, '#e8e8e8');
        g.addColorStop(0.85, '#d0d0d0');
        g.addColorStop(1, '#bababa');
      }
      c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
      c.fillStyle = g; c.fill();
      // 하이라이트 (빛 반사)
      const hl = c.createRadialGradient(x - r*0.27, y - r*0.3, 0, x - r*0.1, y - r*0.14, r*0.65);
      hl.addColorStop(0, color===1 ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.92)');
      hl.addColorStop(0.4, color===1 ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.28)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = hl; c.fill();
      // 외곽 미세 테두리
      if (color === 2) { c.strokeStyle = 'rgba(0,0,0,0.1)'; c.lineWidth = 0.5; c.stroke(); }
      break;
    }

    case 'flat': {
      // 미니멀 플랫 디자인
      c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
      c.fillStyle = color === 1 ? '#1c1c1c' : '#f0f0f0';
      c.fill();
      // 미세 내부 빛
      if (color === 1) {
        c.strokeStyle = 'rgba(255,255,255,0.06)';
        c.lineWidth = 1.5; c.stroke();
      } else {
        c.strokeStyle = 'rgba(0,0,0,0.1)';
        c.lineWidth = 1.5; c.stroke();
        // 작은 하이라이트
        c.beginPath(); c.arc(x - r*0.28, y - r*0.28, r*0.25, 0, Math.PI*2);
        c.fillStyle = 'rgba(255,255,255,0.45)'; c.fill();
      }
      break;
    }

    case 'marble': {
      // 마블 텍스처 - 베이스 + 정맥 곡선
      c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
      const g = c.createRadialGradient(x - r*0.2, y - r*0.28, 0, x, y, r);
      if (color === 1) {
        g.addColorStop(0, '#303030');
        g.addColorStop(0.5, '#181818');
        g.addColorStop(1, '#060606');
      } else {
        g.addColorStop(0, '#faf8f4');
        g.addColorStop(0.4, '#ede8e0');
        g.addColorStop(1, '#d4cec4');
      }
      c.fillStyle = g; c.fill();
      // 마블 정맥 (circle clip 안에서)
      c.save();
      c.clip();
      c.strokeStyle = color===1 ? 'rgba(95,88,80,0.55)' : 'rgba(165,152,132,0.65)';
      c.lineWidth = color===1 ? 0.8 : 0.7;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(x - r*0.85, y - r*0.1);
      c.bezierCurveTo(x - r*0.3, y - r*0.58, x + r*0.38, y - r*0.08, x + r*0.78, y + r*0.58);
      c.stroke();
      c.beginPath();
      c.moveTo(x - r*0.22, y + r*0.78);
      c.bezierCurveTo(x - r*0.04, y + r*0.18, x + r*0.28, y - r*0.22, x + r*0.48, y - r*0.78);
      c.stroke();
      c.strokeStyle = color===1 ? 'rgba(95,88,80,0.28)' : 'rgba(165,152,132,0.38)';
      c.lineWidth = 0.45;
      c.beginPath();
      c.moveTo(x - r*0.6, y + r*0.42);
      c.bezierCurveTo(x - r*0.18, y + r*0.08, x + r*0.18, y + r*0.28, x + r*0.62, y - r*0.18);
      c.stroke();
      c.restore();
      // 외곽
      if (color === 2) { c.strokeStyle = 'rgba(0,0,0,0.07)'; c.lineWidth = 0.5; c.stroke(); }
      break;
    }

    case 'glass': {
      // 반투명 유리 효과
      c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
      const g = c.createLinearGradient(x - r*0.5, y - r, x + r*0.5, y + r);
      if (color === 1) {
        g.addColorStop(0, 'rgba(52,52,88,0.94)');
        g.addColorStop(0.5, 'rgba(10,10,22,0.92)');
        g.addColorStop(1, 'rgba(28,28,58,0.96)');
      } else {
        g.addColorStop(0, 'rgba(242,250,255,0.92)');
        g.addColorStop(0.4, 'rgba(198,222,248,0.86)');
        g.addColorStop(1, 'rgba(152,186,222,0.92)');
      }
      c.fillStyle = g; c.fill();
      // 테두리 광채
      c.strokeStyle = color===1 ? 'rgba(100,112,175,0.72)' : 'rgba(215,232,255,0.88)';
      c.lineWidth = 1; c.stroke();
      // 유리 반사 하이라이트
      c.save();
      c.clip();
      const hl = c.createRadialGradient(x - r*0.18, y - r*0.32, 0, x - r*0.1, y - r*0.2, r*0.7);
      hl.addColorStop(0, 'rgba(255,255,255,0.88)');
      hl.addColorStop(0.22, 'rgba(255,255,255,0.45)');
      hl.addColorStop(0.55, 'rgba(255,255,255,0.1)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = hl;
      c.beginPath(); c.ellipse(x - r*0.18, y - r*0.28, r*0.52, r*0.34, -0.3, 0, Math.PI*2);
      c.fill();
      // 하단 미세 반사
      const bot = c.createRadialGradient(x + r*0.2, y + r*0.35, 0, x + r*0.2, y + r*0.35, r*0.4);
      bot.addColorStop(0, color===1 ? 'rgba(80,100,180,0.3)' : 'rgba(255,255,255,0.25)');
      bot.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = bot;
      c.beginPath(); c.arc(x + r*0.2, y + r*0.35, r*0.4, 0, Math.PI*2);
      c.fill();
      c.restore();
      break;
    }

    case 'neon': {
      // 네온 글로우 링
      const rc = color === 1 ? '#f59e0b' : '#818cf8'; // 흑: 앰버, 백: 인디고
      // 베이스 (어두운 배경)
      c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
      c.fillStyle = color === 1 ? '#06060e' : '#0c0c1a';
      c.fill();
      // 외곽 글로우 링
      c.shadowColor = rc; c.shadowBlur = 12;
      c.beginPath(); c.arc(x, y, r - 2, 0, Math.PI*2);
      c.strokeStyle = rc; c.lineWidth = 2.2; c.stroke();
      // 내부 가는 링
      c.shadowBlur = 4;
      c.beginPath(); c.arc(x, y, r * 0.6, 0, Math.PI*2);
      c.strokeStyle = color === 1 ? 'rgba(245,158,11,0.25)' : 'rgba(129,140,248,0.25)';
      c.lineWidth = 0.8; c.stroke();
      // 중앙 도트
      c.shadowBlur = 8;
      c.beginPath(); c.arc(x, y, r * 0.22, 0, Math.PI*2);
      c.fillStyle = rc; c.fill();
      c.shadowBlur = 0;
      break;
    }
  }
  c.restore();
}

function selectStoneStyle(style) {
  currentStoneStyle = style;
  localStorage.setItem('omok_stone_style', style);
  document.querySelectorAll('.stone-opt').forEach(el =>
    el.classList.toggle('selected', el.dataset.style === style));
  renderStonePreviews();
  if (ctx) drawBoard();
}

function renderStonePreviews() {
  ['classic','flat','marble','glass','neon'].forEach(style => {
    const canvas = document.getElementById('sp-' + style);
    if (!canvas) return;
    const c = canvas.getContext('2d');
    c.clearRect(0, 0, 80, 44);
    drawStoneOnCtx(c, 20, 22, 16, 1, style);
    drawStoneOnCtx(c, 60, 22, 16, 2, style);
  });
}

function updatePlayerStoneIcons() {
  const c1 = document.getElementById('p1-stone-icon')?.getContext('2d');
  if (c1) { c1.clearRect(0,0,28,28); drawStoneOnCtx(c1,14,14,12,1,p1StoneStyle); }
  const c2 = document.getElementById('p2-stone-icon')?.getContext('2d');
  if (c2) { c2.clearRect(0,0,28,28); drawStoneOnCtx(c2,14,14,12,2,p2StoneStyle); }
  const b1 = document.getElementById('p1-style-badge');
  if (b1) b1.textContent = STYLE_NAMES[p1StoneStyle] || p1StoneStyle;
  const b2 = document.getElementById('p2-style-badge');
  if (b2) b2.textContent = STYLE_NAMES[p2StoneStyle] || p2StoneStyle;
}

// ── 유틸 ──────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function updateHeaderNick() {
  document.getElementById('header-nick').textContent = myNickname || '-';
}
function updateRecordUI(rec) {
  if (!rec) return;
  myRecord = rec;
  document.getElementById('rec-win').textContent = rec.win;
  document.getElementById('rec-lose').textContent = rec.lose;
  document.getElementById('rec-draw').textContent = rec.draw;
}
function addChat(text, isSystem = false) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = isSystem ? `<span class="sys">${text}</span>` : text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

// ── 닉네임 ────────────────────────────────────────────────────
function setNickname() {
  const val = document.getElementById('nick-input').value.trim();
  if (val.length < 2 || val.length > 12) {
    document.getElementById('nick-error').textContent = '2~12자로 입력해주세요.';
    return;
  }
  myNickname = val;
  localStorage.setItem('omok_nickname', val);
  updateHeaderNick();
  initSocket();
}
if (myNickname) document.getElementById('nick-input').value = myNickname;
document.getElementById('nick-input').addEventListener('keydown', e => { if (e.key === 'Enter') setNickname(); });

// ── Socket ────────────────────────────────────────────────────
function initSocket() {
  socket = io();

  socket.on('connect', () => {
    showScreen('lobby-screen');
    updateHeaderNick();
    renderStonePreviews();
    selectStoneStyle(currentStoneStyle);
  });
  socket.on('disconnect', () => { addChat('서버와 연결이 끊어졌습니다.', true); });
  socket.on('error', ({ msg }) => {
    document.getElementById('join-error').textContent = msg;
    setTimeout(() => document.getElementById('join-error').textContent = '', 3000);
  });
  socket.on('forbidden', () => {
    if (hoverPos) {
      forbiddenFlash = { row: hoverPos.row, col: hoverPos.col, until: Date.now() + 700 };
      drawBoard();
    }
  });
  socket.on('queue_joined', ({ position }) => {
    document.getElementById('waiting-title').textContent = `매칭 중... (대기 ${position}명)`;
    document.getElementById('waiting-sub').textContent = '상대방을 찾고 있습니다';
    document.getElementById('waiting-room-code').style.display = 'none';
    showScreen('waiting-screen');
  });
  socket.on('queue_cancelled', () => { showScreen('lobby-screen'); });
  socket.on('room_created', ({ roomId, color }) => {
    currentRoom = roomId; myColor = color;
    document.getElementById('waiting-title').textContent = '상대방을 기다리는 중...';
    document.getElementById('waiting-sub').textContent = '방 코드를 친구에게 알려주세요';
    const el = document.getElementById('waiting-room-code');
    el.textContent = roomId; el.style.display = 'block';
    showScreen('waiting-screen');
  });
  socket.on('room_joined', ({ roomId, color }) => { currentRoom = roomId; myColor = color; });

  socket.on('game_start', ({ roomId, board, players, turn, yourColor }) => {
    currentRoom = roomId;
    gameBoard = board.map(r => [...r]);
    currentTurn = turn; gameActive = true; isSpectating = false;
    myColor = yourColor;
    setupPlayerCards(players); updateStatusBar(); initCanvas(); drawBoard();
    showScreen('game-screen');
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('resign-btn').style.display = '';
    addChat('게임 시작!', true);
  });
  socket.on('spectate_start', ({ roomId, board, players, turn }) => {
    currentRoom = roomId;
    gameBoard = board.map(r => [...r]);
    currentTurn = turn; isSpectating = true; gameActive = true;
    setupPlayerCards(players); updateStatusBar(); initCanvas(); drawBoard();
    showScreen('game-screen');
    document.getElementById('resign-btn').style.display = 'none';
    addChat('관전 모드로 입장했습니다.', true);
  });

  socket.on('stone_placed', ({ row, col, color }) => { gameBoard[row][col] = color; drawBoard(); });
  socket.on('turn_changed', ({ turn }) => { currentTurn = turn; updateStatusBar(); });
  socket.on('game_over', ({ result, winner, loser, records }) => {
    gameActive = false; drawBoard();
    if (records) {
      const me = records.find(r => r.nickname === myNickname);
      if (me) updateRecordUI(me.record);
    }
    showOverlay(result, winner, loser, records);
    if (records) records.forEach(r => {
      const card = getPlayerCard(r.nickname);
      if (card) card.querySelector('.player-rec').textContent =
        `${r.record.win}승 ${r.record.lose}패 ${r.record.draw}무`;
    });
  });
  socket.on('rematch_requested', ({ from }) => {
    addChat(`${from}님이 재대결을 요청했습니다.`, true);
    document.getElementById('rematch-btn').textContent = '재대결 수락';
  });
  socket.on('chat', ({ nickname, message }) => {
    addChat(`<span class="cn">${escapeHtml(nickname)}</span>: ${escapeHtml(message)}`);
  });
}

// ── 로비 ──────────────────────────────────────────────────────
function joinRandom() {
  if (socket) socket.emit('join_random', { nickname: myNickname, stoneStyle: currentStoneStyle });
}
function createRoom() {
  if (socket) socket.emit('create_room', { nickname: myNickname, stoneStyle: currentStoneStyle });
}
function joinRoom() {
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (!code) { document.getElementById('join-error').textContent = '방 코드를 입력해주세요.'; return; }
  socket.emit('join_room', { roomId: code, nickname: myNickname, stoneStyle: currentStoneStyle });
}
function cancelWaiting() { socket.emit('cancel_random'); showScreen('lobby-screen'); }

// ── 게임 ──────────────────────────────────────────────────────
function resignGame() {
  if (!confirm('기권하시겠습니까?')) return;
  socket.emit('resign', { roomId: currentRoom });
}
function requestRematch() {
  socket.emit('rematch_request', { roomId: currentRoom });
  document.getElementById('rematch-btn').textContent = '수락 대기 중...';
  document.getElementById('rematch-btn').disabled = true;
}
function goLobby() {
  currentRoom = null; myColor = 0; gameBoard = []; gameActive = false;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('chat-messages').innerHTML = '';
  showScreen('lobby-screen');
  renderStonePreviews();
  selectStoneStyle(currentStoneStyle);
}

// ── 채팅 ──────────────────────────────────────────────────────
function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg || !currentRoom) return;
  socket.emit('chat', { roomId: currentRoom, nickname: myNickname, message: msg });
  input.value = '';
}
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
document.getElementById('room-code-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });

// ── UI ────────────────────────────────────────────────────────
function setupPlayerCards(players) {
  const black = players.find(p => p.color === 1);
  const white = players.find(p => p.color === 2);
  p1StoneStyle = black ? (black.stoneStyle || 'classic') : 'classic';
  p2StoneStyle = white ? (white.stoneStyle || 'classic') : 'classic';
  document.getElementById('p1-name').textContent = black ? black.nickname : '?';
  document.getElementById('p1-rec').textContent = black ? `${black.record.win}승 ${black.record.lose}패` : '';
  document.getElementById('p2-name').textContent = white ? white.nickname : '?';
  document.getElementById('p2-rec').textContent = white ? `${white.record.win}승 ${white.record.lose}패` : '';
  updatePlayerStoneIcons();
}
function getPlayerCard(nickname) {
  if (document.getElementById('p1-name').textContent === nickname) return document.getElementById('player1-card');
  if (document.getElementById('p2-name').textContent === nickname) return document.getElementById('player2-card');
  return null;
}
function updateStatusBar() {
  const bar = document.getElementById('status-bar');
  document.getElementById('player1-card').classList.toggle('active-turn', currentTurn === 1);
  document.getElementById('player2-card').classList.toggle('active-turn', currentTurn === 2);
  if (isSpectating) { bar.textContent = currentTurn === 1 ? '⚫ 흑의 차례' : '⚪ 백의 차례'; return; }
  if (myColor === currentTurn) { bar.textContent = '✨ 당신의 차례!'; bar.style.color = 'var(--accent2)'; }
  else { bar.textContent = currentTurn === 1 ? '⚫ 흑의 차례' : '⚪ 백의 차례'; bar.style.color = 'var(--text2)'; }
}
function showOverlay(result, winner, loser, records) {
  const title = document.getElementById('overlay-title');
  const sub = document.getElementById('overlay-sub');
  const recsEl = document.getElementById('overlay-records');
  const btn = document.getElementById('rematch-btn');
  btn.textContent = '재대결'; btn.disabled = false;
  btn.style.display = isSpectating ? 'none' : '';
  if (result === 'win') {
    if (winner === myNickname) { title.textContent = '🎉 승리!'; title.style.color = '#7ecb7e'; }
    else { title.textContent = '😢 패배'; title.style.color = 'var(--accent)'; }
    sub.textContent = `${winner}님이 승리했습니다`;
  } else if (result === 'draw') {
    title.textContent = '🤝 무승부'; title.style.color = 'var(--accent2)'; sub.textContent = '비겼습니다!';
  } else if (result === 'resign') {
    if (loser === myNickname) { title.textContent = '🏳️ 기권'; title.style.color = 'var(--accent)'; }
    else { title.textContent = '🎉 승리!'; title.style.color = '#7ecb7e'; }
    sub.textContent = `${loser}님이 기권했습니다`;
  } else if (result === 'disconnect') {
    title.textContent = loser === myNickname ? '💨 연결 끊김' : '🎉 승리!';
    title.style.color = loser === myNickname ? 'var(--text2)' : '#7ecb7e';
    sub.textContent = `${loser}님의 연결이 끊어졌습니다`;
  }
  if (records) recsEl.innerHTML = records.map(r =>
    `<div class="ov-rec"><div class="ov-rec-name">${escapeHtml(r.nickname)}</div><div class="ov-rec-val">${r.record.win}승 ${r.record.lose}패 ${r.record.draw}무</div></div>`
  ).join('');
  document.getElementById('overlay').classList.add('show');
}
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 캔버스 ────────────────────────────────────────────────────
let canvas, ctx, hoverPos = null, hoverForbidden = false, forbiddenFlash = null;

function initCanvas() {
  canvas = document.getElementById('board-canvas');
  canvas.width = CANVAS_SIZE; canvas.height = CANVAS_SIZE;
  ctx = canvas.getContext('2d');
  canvas.onmousemove = (e) => {
    if (!gameActive || isSpectating || myColor !== currentTurn) {
      hoverPos = null; hoverForbidden = false; canvas.style.cursor = 'crosshair'; drawBoard(); return;
    }
    const { row, col } = getCell(e);
    if (row >= 0 && row < SIZE && col >= 0 && col < SIZE && gameBoard[row][col] === 0) {
      hoverPos = { row, col };
      hoverForbidden = isClientForbidden(row, col);
      canvas.style.cursor = hoverForbidden ? 'not-allowed' : 'crosshair';
    } else { hoverPos = null; hoverForbidden = false; canvas.style.cursor = 'crosshair'; }
    drawBoard();
  };
  canvas.onmouseleave = () => { hoverPos = null; drawBoard(); };
  canvas.onclick = (e) => {
    if (!gameActive || isSpectating || myColor !== currentTurn) return;
    const { row, col } = getCell(e);
    if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
    if (gameBoard[row][col] !== 0) return;
    socket.emit('place_stone', { roomId: currentRoom, row, col });
    hoverPos = null;
  };
}

function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    col: Math.round((e.clientX - rect.left - PADDING) / CELL),
    row: Math.round((e.clientY - rect.top - PADDING) / CELL)
  };
}

function drawBoard() {
  if (!ctx) return;
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  // 보드 배경
  ctx.fillStyle = '#d4a96a';
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  // 격자
  ctx.strokeStyle = '#8b6328'; ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(PADDING + i*CELL, PADDING); ctx.lineTo(PADDING + i*CELL, PADDING + (SIZE-1)*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PADDING, PADDING + i*CELL); ctx.lineTo(PADDING + (SIZE-1)*CELL, PADDING + i*CELL); ctx.stroke();
  }
  // 화점
  ctx.fillStyle = '#8b6328';
  [[3,3],[3,11],[7,7],[11,3],[11,11]].forEach(([r,c]) => {
    ctx.beginPath(); ctx.arc(PADDING + c*CELL, PADDING + r*CELL, 4, 0, Math.PI*2); ctx.fill();
  });
  // 돌 렌더링 (각자 스타일 적용)
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (gameBoard[r] && gameBoard[r][c]) drawStone(r, c, gameBoard[r][c], 1.0);
  // 호버
  if (hoverPos) {
    if (hoverForbidden) drawForbiddenMark(hoverPos.row, hoverPos.col, false);
    else drawStone(hoverPos.row, hoverPos.col, myColor, 0.45);
  }
  // 금수 플래시
  if (forbiddenFlash && Date.now() < forbiddenFlash.until) {
    drawForbiddenMark(forbiddenFlash.row, forbiddenFlash.col, true);
    requestAnimationFrame(drawBoard);
  } else if (forbiddenFlash && Date.now() >= forbiddenFlash.until) {
    forbiddenFlash = null;
  }
}

function drawStone(row, col, color, alpha) {
  const x = PADDING + col * CELL, y = PADDING + row * CELL, r = CELL * 0.44;
  ctx.save();
  ctx.globalAlpha = alpha;
  // 각 플레이어의 개인 스타일로 그리기
  drawStoneOnCtx(ctx, x, y, r, color, color === 1 ? p1StoneStyle : p2StoneStyle);
  ctx.restore();
}

function drawForbiddenMark(row, col, flash) {
  const x = PADDING + col * CELL, y = PADDING + row * CELL, r = CELL * 0.4;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = flash ? 'rgba(239,68,68,0.38)' : 'rgba(239,68,68,0.18)'; ctx.fill();
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = flash ? 2.5 : 2; ctx.stroke();
  ctx.lineWidth = flash ? 3 : 2.5; ctx.lineCap = 'round';
  const s = r * 0.52;
  ctx.beginPath(); ctx.moveTo(x-s, y-s); ctx.lineTo(x+s, y+s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s, y-s); ctx.lineTo(x-s, y+s); ctx.stroke();
  ctx.restore();
}

// ── 금수 체크 ─────────────────────────────────────────────────
function isClientForbidden(row, col) {
  if (myColor !== 1) return false;
  const b = gameBoard.map(r => [...r]);
  b[row][col] = 1;
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr,dc] of dirs) {
    let cnt = 1;
    for (let d=1;d<5;d++){const r=row+dr*d,c=col+dc*d;if(r<0||r>=15||c<0||c>=15||b[r][c]!==1)break;cnt++;}
    for (let d=1;d<5;d++){const r=row-dr*d,c=col-dc*d;if(r<0||r>=15||c<0||c>=15||b[r][c]!==1)break;cnt++;}
    if (cnt === 5) return false;
  }
  for (const [dr,dc] of dirs) {
    let cnt=1;
    for (let d=1;d<=5;d++){const r=row+dr*d,c=col+dc*d;if(r<0||r>=15||c<0||c>=15||b[r][c]!==1)break;cnt++;}
    for (let d=1;d<=5;d++){const r=row-dr*d,c=col-dc*d;if(r<0||r>=15||c<0||c>=15||b[r][c]!==1)break;cnt++;}
    if (cnt >= 6) return true;
  }
  let threes = 0;
  for (const [dr,dc] of dirs) {
    const get = i => { const r=row+dr*i,c=col+dc*i; if(r<0||r>=15||c<0||c>=15) return -1; return b[r][c]; };
    let fwd=0,bwd=0;
    for (let d=1;d<=4;d++){if(get(d)===1)fwd++;else break;}
    for (let d=1;d<=4;d++){if(get(-d)===1)bwd++;else break;}
    if (fwd+bwd+1===3 && get(fwd+1)===0 && get(-bwd-1)===0) threes++;
  }
  return threes >= 2;
}

// ── 시작 ──────────────────────────────────────────────────────
if (myNickname.length >= 2) { initSocket(); updateHeaderNick(); }
else showScreen('nick-screen');
